# Uptime check every 30 minutes. If the app or the database is down the run fails,
# and GitHub emails the repository owner. Free, no extra account.
name: Health
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Database and login service
        run: curl -fsS --retry 3 --retry-delay 20 -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" "${{ vars.SUPABASE_URL }}/auth/v1/health"
      - name: Website
        if: vars.SITE_URL != ''
        run: curl -fsS --retry 3 --retry-delay 20 -o /dev/null "${{ vars.SITE_URL }}"
